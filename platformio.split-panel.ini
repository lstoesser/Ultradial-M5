[platformio]
src_dir = checks/split_panel
lib_dir = libraries

[env]
platform = espressif32
board = m5stack-cores3
framework = arduino
lib_deps =
  M5Unified@0.2.25
  M5GFX@0.2.32

[env:core_controller]
build_flags = -DCORE_CONTROLLER_CHECK

; API check ONLY, not a Tab5 binary. Build/upload Tab5 from Arduino IDE.
[env:tab_graphs_api_check]
build_flags = -DTAB_GRAPH_CHECK
